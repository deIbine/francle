# Le nom de chaque région précédé de son article, pour l'écrire au milieu d'une phrase française (« La réponse était
# le Grand Est. »). Seul le français en a besoin : en anglais, les noms de régions s'écrivent sans article. Ce n'est
# donc pas un fichier de textes traduit (textes_fr / textes_en), mais une donnée du français, lue par Textes.
# Clé : le nom de la région dans l'enum RegionFr. TextesTest vérifie que chaque région en a une, et qu'elle finit
# par le nom de la région. Une région sans article (Mayotte) a son seul nom ; La Réunion porte déjà le sien.
# Rhône-Alpes et Midi-Pyrénées s'emploient d'ordinaire sans article (« en Midi-Pyrénées ») : « la région … ».

